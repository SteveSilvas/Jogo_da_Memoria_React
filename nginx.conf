server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão para JS, CSS e SVG
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets com hash no nome podem ser cacheados por muito tempo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # O service worker e o manifesto de precache precisam ser revalidados,
    # senão o navegador fica preso numa versão antiga do jogo.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /precache-manifest.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA: qualquer rota desconhecida cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
